{% extends "base.html" %}{% block title %}Cambia password · Data Dashboard{% endblock %}{% block content %}
<div class="card" style="max-width:620px"><h1>Cambia password</h1><p class="muted">Modifica la password dell'account con cui sei autenticato.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Password attuale</label><input type="password" name="current_password" autocomplete="current-password" required>
<label>Nuova password</label><input type="password" name="new_password" minlength="8" autocomplete="new-password" required>
<label>Conferma nuova password</label><input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
<div class="form-actions"><button class="btn" type="submit">Salva nuova password</button><a class="btn secondary" href="{{ url_for('dashboard') }}">Annulla</a></div>
</form></div>
{% endblock %}
