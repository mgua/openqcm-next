{% extends "base.html" %}{% block title %}Importa CSV · Data Dashboard{% endblock %}{% block content %}
<div class="card" style="max-width:720px"><h1>Importa CSV</h1><p class="muted">Il file deve contenere: Date, Time, Relative_time, Temperature, Resonance_Frequency, Dissipation.</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Nome del dataset</label><input name="name" placeholder="Es. Misura durante il video"><label>File CSV</label><input type="file" name="csv_file" accept=".csv,text/csv" required><div class="form-actions"><button class="btn" type="submit">Importa</button><a class="btn secondary" href="{{ url_for('dashboard') }}">Annulla</a></div></form></div>
{% endblock %}
